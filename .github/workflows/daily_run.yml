name: Daily Job Run

on:
  schedule:
    # Mon–Fri at 07:00 Vienna time (= 05:00 UTC in winter, 06:00 UTC in summer)
    # Using 05:00 UTC; adjust to 06:00 UTC in summer manually if needed
    - cron: '0 5 * * 1-5'
  workflow_dispatch:   # allow manual trigger from GitHub UI

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore & build
        run: dotnet build --configuration Release

      - name: Restore SQLite database (if exists)
        uses: actions/cache@v4
        with:
          path: src/JobRadar.Cli/bin/Release/net10.0/data/jobradar.db
          key: jobradar-db-${{ github.ref_name }}
          restore-keys: jobradar-db-

      - name: Run JobRadar
        env:
          JOOBLE_API_KEY:      ${{ secrets.JOOBLE_API_KEY }}
          EMAIL_FROM:          ${{ secrets.EMAIL_FROM }}
          EMAIL_TO:            ${{ secrets.EMAIL_TO }}
          EMAIL_APP_PASSWORD:  ${{ secrets.EMAIL_APP_PASSWORD }}
        run: dotnet run --project src/JobRadar.Cli --configuration Release -- --source=jooble

      - name: Save SQLite database
        uses: actions/cache/save@v4
        with:
          path: src/JobRadar.Cli/bin/Release/net10.0/data/jobradar.db
          key: jobradar-db-${{ github.ref_name }}-${{ github.run_id }}

      - name: Upload HTML report as artifact
        uses: actions/upload-artifact@v4
        with:
          name: jobradar-report-${{ github.run_id }}
          path: src/JobRadar.Cli/bin/Release/net10.0/reports/
          if-no-files-found: ignore
          retention-days: 14
